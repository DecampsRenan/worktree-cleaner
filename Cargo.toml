[package]
name = "worktree-cleaner"
version = "0.2.0"
edition = "2024"
# Our own code only needs the edition-2024 floor (1.85), but ratatui — and
# through it instability, time and darling — declares 1.88.0, so that's what a
# fresh `cargo install` actually requires. Keep in sync with the `msrv` job in
# .github/workflows/ci.yml, which is the thing that verifies it: a warm local
# registry lets an older cargo build the tree anyway and quietly under-report
# this.
rust-version = "1.88"
description = "Traverse a directory tree, find git worktrees, rank them by relevance, and interactively delete orphaned or stale ones."
license = "MIT"
repository = "https://github.com/DecampsRenan/worktree-cleaner"
readme = "README.md"
keywords = ["git", "worktree", "tui", "cli", "cleanup"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "wtc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
git2 = "0.21.0"
ignore = "0.4.26"
ratatui = "0.30.2"

[dev-dependencies]
tempfile = "3.27.0"
